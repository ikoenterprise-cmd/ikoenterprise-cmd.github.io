<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livino Arga Pratama</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#000; color:#fff; font-family:'Cormorant Garamond', serif; display:flex; justify-content:center; align-items:center; min-height:100vh; text-align:center; }
  .box { padding:30px; }
  h1 { font-size:65px; letter-spacing:12px; line-height:1.1; font-weight:300; margin:0; }
  .sub { font-family:'Inter', sans-serif; letter-spacing:5px; color:#888; font-size:14px; margin-top:15px; font-weight:300; }
  .line { width:90%; height:1px; background:#222; margin:60px auto 30px; }
  .quote { font-style:italic; color:#777; font-size:18px; margin-bottom:40px; }
  .link { font-family:'Inter', sans-serif; color:#444; font-size:13px; letter-spacing:1px; }
  #musicBtn { margin-top:30px; background:none; border:1px solid #333; color:#666; padding:10px 25px; letter-spacing:3px; font-size:11px; cursor:pointer; font-family:'Inter', sans-serif; }
  #musicBtn:hover { border-color:#fff; color:#fff; }
</style>
</head>
<body>
<div class="box">
  <h1>LIVINO<br>ARGA</h1>
  <div class="sub">Pratama — Iko Enterprise</div>
  <div class="line"></div>
  <div class="quote">"Manusia itu paling jujur pas lagi sendirian."</div>
  <div class="link">github.com/ikoenterprise-cmd</div>
  <button id="musicBtn" onclick="toggleMusic()">▶ PLAY MUSIC</button>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
  const music = document.getElementById("bgMusic");
  const btn = document.getElementById("musicBtn");
  let isPlaying = false;
  function toggleMusic(){
    if(!isPlaying){
      music.volume = 0.3;
      music.play().then(()=>{ btn.innerText="■ STOP MUSIC"; isPlaying=true; }).catch(()=>{ alert("Klik sekali lagi Vin, browser butuh izin dulu"); });
    } else {
      music.pause(); btn.innerText="▶ PLAY MUSIC"; isPlaying=false;
    }
  }
</script>
</body>
</html>
