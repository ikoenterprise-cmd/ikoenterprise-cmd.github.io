<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livino Arga Pratama - Johan Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400&display=swap');
  body {
    margin:0; background:#0a0a0a; color:#e0e0e0; font-family:'Crimson Pro', serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center;
    overflow:hidden;
  }
  .container { max-width:600px; padding:20px; z-index:2; }
  img.johan {
    width:180px; height:180px; border-radius:50%; object-fit:cover;
    filter:grayscale(30%) brightness(0.9); border:2px solid #333;
    margin-bottom:25px; box-shadow:0 0 30px rgba(255,255,255,0.1);
  }
  h1 { font-weight:300; letter-spacing:4px; font-size:2.2em; margin:10px 0; }
  #typewriter { font-size:1.2em; font-style:italic; color:#aaa; min-height:60px; margin:20px 0; }
  .btn-music {
    background:transparent; border:1px solid #555; color:#888; padding:8px 20px;
    cursor:pointer; letter-spacing:2px; margin-top:15px; font-size:0.8em;
  }
  .btn-music:hover { border-color:#fff; color:#fff; }
</style>
</head>
<body>

<div class="container">
  <img class="johan" src="https://i.pinimg.com/736x/0d/7d/6d/0d7d6d3f8e0e0e0e0e0e0e0e.jpg" onerror="this.src='https://i.imgur.com/8Km9tLL.jpg'" alt="Johan">
  <h1>LIVINO ARGA PRATAMA</h1>
  <div id="typewriter"></div>
  <p style="letter-spacing:3px; font-size:0.9em; color:#666;">IKO ENTERPRISE</p>
  <button class="btn-music" onclick="toggleMusic()" id="musicBtn">▶ PLAY MUSIC</button>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_fbd50719a1.mp3?filename=dark-ambient-123888.mp3" type="audio/mpeg">
</audio>

<script>
  const text = '"Manusia itu paling jujur... saat sedang sendirian." - Johan Liebert';
  let i = 0;
  function typeWriter() {
    if (i < text.length) {
      document.getElementById("typewriter").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, 70);
    }
  }
  setTimeout(typeWriter, 800);

  const music = document.getElementById("bgMusic");
  const btn = document.getElementById("musicBtn");
  let playing = false;
  function toggleMusic() {
    if (!playing) {
      music.volume = 0.4;
      music.play();
      btn.innerText = "■ STOP MUSIC";
      playing = true;
    } else {
      music.pause();
      btn.innerText = "▶ PLAY MUSIC";
      playing = false;
    }
  }
</script>

</body>
</html>
